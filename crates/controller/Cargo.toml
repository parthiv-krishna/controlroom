[package]
name = "controlroom-controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Test helpers for this crate's and the web shell's tests: a fake remote machine (client-core's
# in-process SSH server with a scratch $HOME and the fake agent) and the built controlroomd.
test-support = ["controlroom-client-core/test-support", "dep:tempfile"]

[dependencies]
controlroom-client-core.workspace = true
controlroom-protocol.workspace = true
# Schedules: five-field cron with DST handling, in IANA time zones (the host's tz database,
# falling back to a bundled one where the host has none, e.g. a minimal container).
croner = { version = "4.0", default-features = false, features = ["jiff"] }
data-encoding = "2.6"
futures.workspace = true
getrandom = "0.4"
jiff = { version = "0.2", features = ["tzdb-bundle-always"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
tempfile = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
# Web Push: pure RustCrypto RFC 8291 encryption + RFC 8292 VAPID (no OpenSSL), sent with
# reqwest over rustls.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
web-push-native = "0.5"

[dev-dependencies]
controlroom-controller = { path = ".", features = ["test-support"] }
tempfile.workspace = true
# Paused time for the notifier's delay and presence tests.
tokio = { workspace = true, features = ["test-util"] }
# Capturing the log in `tests/models.rs` (keys never reach it).
tracing-subscriber.workspace = true

[lints]
workspace = true
