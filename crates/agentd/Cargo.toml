[package]
name = "controlroom-agentd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "controlroom-agentd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# Decoding sign-in tokens' claims (the account shown in Settings › Models).
base64 = "0.22"
clap.workspace = true
controlroom-drivers.workspace = true
controlroom-protocol.workspace = true
controlroom-runtime.workspace = true
controlroom-sandbox.workspace = true
controlroom-supervisor.workspace = true
controlroom-transcript.workspace = true
futures.workspace = true
# Provider tests (Settings › Models): one request to the provider over rustls.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# flock() without unsafe.
rustix = { version = "1.1", features = ["fs", "process"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml = "0.9"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
controlroom-fixture-tool = { path = "../fixture-tool" }
tempfile.workspace = true
ulid.workspace = true

[lints]
workspace = true
