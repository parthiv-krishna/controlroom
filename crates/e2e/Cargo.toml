[package]
name = "controlroom-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "End-to-end tests of the remote-tools model (test-only)"

[dependencies]
controlroom-client-core.workspace = true
controlroom-controller = { workspace = true, features = ["test-support"] }
controlroom-protocol.workspace = true
# Killing test processes without unsafe.
rustix = { version = "1.1", features = ["process"] }
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true

[dev-dependencies]
sha2 = "0.11"

[lints]
workspace = true
